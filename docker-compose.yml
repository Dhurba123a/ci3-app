version: "3.9"

services:
  app:
    build: .
    container_name: ${PROJECT_NAME}_app
    volumes:
      # Application source (acceptable for now; will be removed for prod later)
      - .:/var/www/html

      # Composer dependencies (isolated per environment by project name)
      - vendor_data:/var/www/html/vendor

      # Uploads directory (environment-specific path)
      - ${UPLOADS_PATH}:/var/www/html/uploads
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - db
    command: >
      sh -c "
      if [ ! -d vendor ] || [ ! -f vendor/autoload.php ]; then
        echo 'Installing composer dependencies...';
        composer install --no-dev --optimize-autoloader --no-scripts;
      fi;
      apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci3
      MYSQL_USER: ci3
      MYSQL_PASSWORD: ci3
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${PROJECT_NAME}_pma
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT}:80"

volumes:
  dbdata:
  vendor_data:

